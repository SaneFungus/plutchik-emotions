name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Upewnij się, że to nazwa Twojej głównej gałęzi

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Folder, który powstaje po 'npm run build'
          branch: gh-pages # Gałąź, na której GitHub Pages będzie szukać plików
