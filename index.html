yjny, zbliż się do mnie”.",en:"The surplus energy turns into concrete behavior: you want to be seen. Louder laughter, bigger gestures, talking about your win — a signal to the group: “I'm strong and attractive, come closer.”"},function:{pl:"Ewolucyjnie radość istnieje po to, by demonstrować kondycję i zasoby potencjalnym partnerom i sojusznikom. To emocja, która buduje więzi, przyciąga innych i utrwala zachowania prowadzące do sukcesu.",en:"Evolutionarily, joy exists to display fitness and resources to potential partners and allies. It's the emotion that builds bonds, attracts others, and reinforces the behaviors that led to success."}},intensity:{low:{pl:"Pogoda ducha",en:"Serenity"},medium:{pl:"Radość",en:"Joy"},high:{pl:"Ekstaza",en:"Ecstasy"}},vector:{pl:"W GÓRĘ / NA ZEWNĄTRZ",en:"UPWARD / OUTWARD"},signals:{pl:["Uniesione kąciki ust (uśmiech angażujący oczy)","Błyszczące, lekko wilgotne oczy","Rozluźniona, otwarta postawa ciała","Podniesiona głowa i klatka piersiowa","Energiczne, płynne gesty","Częsty śmiech, chichot","Eksponowanie szyi i nadgarstków","Sprężysty krok, 'lekkość' ciała"],en:["Raised corners of the mouth (smile engaging eyes)","Sparkling, slightly moist eyes","Relaxed, open body posture","Raised head and chest","Energetic, fluid gestures","Frequent laughter, giggling","Exposing neck and wrists","Bouncy step, 'lightness' of body"]},colorClass:"text-yellow-500",nameClass:"text-yellow-700 dark:text-yellow-500",bgLightClass:"bg-yellow-500/10",hex:"#eab308",icon:Wd},{id:"TRUST",name:{pl:"Zaufanie",en:"Trust"},desc:{pl:"Decyzja organizmu o wpuszczeniu kogoś do strefy intymnej. Niezbędna do aktu tworzenia więzi.",en:"Organism's decision to let someone into the intimate zone. Essential for bonding."},stimulus:{pl:"PRZYJACIEL",en:"FRIEND"},impulse:{pl:"Rozluźnienie / Ciepło",en:"Relaxation / Warmth"},action:{pl:"OTWARCIE GRANIC",en:"OPENING BOUNDARIES"},function:{pl:"WIĘŹ / INTYMNOŚĆ",en:"BONDING / INTIMACY"},mechanism:{stimulus:{pl:"Organizm rozpoznaje osobę lub sytuację jako nieszkodliwą — kogoś „ze swojego plemienia”. To ocena bezpieczeństwa dokonywana zanim świadomie zdecydujesz, że możesz komuś zaufać.",en:"The organism recognizes a person or situation as harmless — someone “from your own tribe.” It's a safety assessment made before you consciously decide you can trust someone."},impulse:{pl:"Napięcie obronne opada, mięśnie twarzy i ciała się rozluźniają, oddech zwalnia. Pojawia się ciepło i chęć zbliżenia — ciało otwiera się, zamiast się bronić.",en:"Defensive tension drops, facial and body muscles relax, breathing slows. Warmth appears along with a pull toward closeness — the body opens instead of guarding itself."},action:{pl:"Rozluźnienie zamienia się w konkretny gest: odsłaniasz wrażliwe miejsca (szyję, dłonie), pochylasz się w stronę drugiej osoby, synchronizujesz z nią ruchy. To fizyczna zgoda na bliskość.",en:"Relaxation turns into a concrete gesture: you expose vulnerable spots (neck, palms), lean toward the other person, sync your movements with theirs. It's physical consent to closeness."},function:{pl:"Zaufanie istnieje po to, by umożliwić współpracę i budowanie trwałych relacji — bez niego niemożliwa byłaby ani opieka nad potomstwem, ani życie w grupie.",en:"Trust exists to make cooperation and lasting relationships possible — without it, neither caring for offspring nor living in a group would be possible."}},intensity:{low:{pl:"Akceptacja",en:"Acceptance"},medium:{pl:"Zaufanie",en:"Trust"},high:{pl:"Oddanie",en:"Admiration"}},vector:{pl:"DO SIEBIE / WCHŁANIANIE",en:"TOWARD SELF / ABSORPTION"},signals:{pl:["Stały, łagodny kontakt wzrokowy","Odsłonięcie wrażliwych części ciała (szyja, brzuch)","Otwarte dłonie (pokazywanie wnętrza)","Pochylenie ciała w stronę rozmówcy","Synchronizacja ruchów (efekt lustra)","Rozluźnione mięśnie twarzy (brak napięcia)","Spokojny, miarowy oddech","Ciepły, kojący ton głosu"],en:["Steady, gentle eye contact","Exposing vulnerable body parts (neck, belly)","Open hands (showing palms)","Leaning body towards the interlocutor","Synchronization of movements (mirror effect)","Relaxed facial muscles (no tension)","Calm, measured breathing","Warm, soothing voice tone"]},colorClass:"text-lime-500",nameClass:"text-lime-700 dark:text-lime-500",bgLightClass:"bg-lime-500/10",hex:"#84cc16",icon:x0},{id:"FEAR",name:{pl:"Strach",en:"Fear"},desc:{pl:"Ciało rozpoznaje siłę wyższą od siebie. Priorytetem jest zachowanie integralności poprzez wycofanie.",en:"The body recognizes a force greater than itself. Priority is to preserve integrity by withdrawing."},stimulus:{pl:"ZAGROŻENIE",en:"THREAT"},impulse:{pl:"Napięcie / Alarm",en:"Tension / Alarm"},action:{pl:"UCIECZKA / UNIK",en:"ESCAPE / AVOIDANCE"},function:{pl:"OCHRONA",en:"PROTECTION"},mechanism:{stimulus:{pl:"Ciało wykrywa siłę większą od siebie — coś, co może je zranić lub zniszczyć. Ocena zagrożenia zachodzi błyskawicznie, zanim zdołasz nazwać, co właściwie się dzieje.",en:"The body detects a force greater than itself — something that could hurt or destroy it. The threat assessment happens instantly, before you can even name what's happening."},impulse:{pl:"Serce przyspiesza, oddech płycieje, krew odpływa z kończyn do organów życiowych. Ciało mobilizuje się do jednej z dwóch opcji: uciec albo zamarznąć w bezruchu.",en:"The heart races, breathing shallows, blood drains from the limbs toward vital organs. The body mobilizes for one of two options: flee, or freeze in stillness."},action:{pl:"Napięcie rozładowuje się przez oddalenie od źródła zagrożenia — dosłowną ucieczkę, cofnięcie się, unik albo skulenie osłaniające szyję i brzuch.",en:"The tension discharges through distancing from the source of danger — literal flight, stepping back, avoidance, or crouching to shield the neck and belly."},function:{pl:"Strach istnieje po to, by chronić integralność ciała przed zniszczeniem. To najstarszy i najszybszy mechanizm przetrwania — działa, zanim jeszcze pomyślisz.",en:"Fear exists to protect the body's integrity from destruction. It's the oldest and fastest survival mechanism — it acts before you even think."}},intensity:{low:{pl:"Niepokój",en:"Anxiety"},medium:{pl:"Strach",en:"Fear"},high:{pl:"Przerażenie",en:"Terror"}},vector:{pl:"DO TYŁU / KURCZENIE SIĘ",en:"BACKWARD / CONTRACTION"},signals:{pl:["Przyspieszone bicie serca (kołatanie)","Płytki, szybki oddech lub wstrzymywanie powietrza","Bladość twarzy, odpływ krwi z kończyn","Zimny pot (szczególnie na czole i dłoniach)","Drżenie rąk, kolan lub warg","Szeroko otwarte oczy, rozszerzone źrenice","Suchość w ustach (częste przełykanie śliny)","Odruchowe kulenie się (osłanianie szyi/brzucha)"],en:["Accelerated heartbeat (palpitations)","Shallow, rapid breathing or holding breath","Pale face, blood draining from limbs","Cold sweat (especially on forehead and palms)","Trembling hands, knees or lips","Wide open eyes, dilated pupils","Dry mouth (frequent swallowing)","Reflexive crouching (shielding neck/belly)"]},colorClass:"text-emerald-500",nameClass:"text-emerald-700 dark:text-emerald-500",bgLightClass:"bg-emerald-500/10",hex:"#10b981",icon:z0},{id:"SURPRISE",name:{pl:"Zaskoczenie",en:"Surprise"},desc:{pl:"Nagły reset uwagi ('Biała karta'). Przerwanie działania, by ocenić nowy bodziec.",en:"Sudden reset of attention ('Blank slate'). Interrupting action to assess a new stimulus."},stimulus:{pl:"NAGŁY OBIEKT",en:"SUDDEN OBJECT"},impulse:{pl:"Wdech / Zatrzymanie",en:"Inhale / Freezing"},action:{pl:"STOP / RESET",en:"STOP / RESET"},function:{pl:"ORIENTACJA",en:"ORIENTATION"},mechanism:{stimulus:{pl:"Coś pojawia się w polu uwagi bez ostrzeżenia — dźwięk, ruch, informacja, której się nie spodziewałeś. Umysł nie ma jeszcze gotowej kategorii, do której mógłby to przypisać.",en:"Something appears in your field of attention without warning — a sound, a movement, information you didn't expect. The mind doesn't yet have a ready category to file it under."},impulse:{pl:"Wszystko na chwilę się zatrzymuje: gwałtowny, krótki wdech, bezruch, szeroko otwarte oczy. To „biała karta” — ciało kasuje bieżące działanie, by w pełni przyjąć nowy bodziec.",en:"Everything stops for a moment: a sudden, sharp inhale, stillness, wide-open eyes. It's a “blank slate” — the body cancels its current action to fully take in the new stimulus."},action:{pl:"Zatrzymanie zamienia się w krótki reset uwagi: cofnięcie się, podniesienie dłoni do twarzy, moment całkowitego bezruchu, zanim ciało zdecyduje, co dalej.",en:"The freeze turns into a brief reset of attention: stepping back, raising a hand to the face, a moment of total stillness before the body decides what comes next."},function:{pl:"Zaskoczenie istnieje po to, by szybko przekierować całą uwagę na nowy, potencjalnie ważny element otoczenia — zanim zdążysz go zignorować.",en:"Surprise exists to quickly redirect your entire attention to a new, potentially important element of the environment — before you can ignore it."}},intensity:{low:{pl:"Roztargnienie",en:"Distraction"},medium:{pl:"Zaskoczenie",en:"Surprise"},high:{pl:"Szok",en:"Amazement"}},vector:{pl:"STOP / ROZSZERZENIE",en:"STOP / EXPANSION"},signals:{pl:["Gwałtowne otwarcie ust (opadnięcie żuchwy)","Wysoko uniesione brwi (zmarszczki na czole)","Szeroko otwarte oczy (widoczne białka)","Nagły, krótki wdech (gasp)","Chwilowe zamarcie w bezruchu (reakcja 'freeze')","Odruchowe cofnięcie się (krok w tył)","Podniesienie dłoni do ust lub klatki piersiowej","Rozluźnienie mięśni po chwili (jeśli brak zagrożenia)"],en:["Sudden opening of mouth (jaw drop)","High raised eyebrows (wrinkles on forehead)","Wide open eyes (visible whites)","Sudden, short inhale (gasp)","Momentary freezing in stillness ('freeze' reaction)","Reflexive stepping back","Raising hands to mouth or chest","Relaxation of muscles after a moment (if no threat)"]},colorClass:"text-cyan-500",nameClass:"text-cyan-700 dark:text-cyan-500",bgLightClass:"bg-cyan-500/10",hex:"#06b6d4",icon:r0},{id:"SADNESS",name:{pl:"Smutek",en:"Sadness"},desc:{pl:"Sygnał dla grupy o potrzebie wsparcia ('Pomóż mi'). Oszczędzanie energii w obliczu nieodwracalnej straty.",en:"Signal to the group for support ('Help me'). Conserving energy in the face of irreversible loss."},stimulus:{pl:"UTRATA",en:"LOSS"},impulse:{pl:"Ciężar / Zapadanie",en:"Heaviness / Sinking"},action:{pl:"PŁACZ / BEZRUCH",en:"CRYING / STILLNESS"},function:{pl:"REINTEGRACJA",en:"REINTEGRATION"},mechanism:{stimulus:{pl:"Coś ważnego zniknęło bezpowrotnie — osoba, szansa, status, złudzenie. Sytuacji nie da się już naprawić działaniem, więc organizm przestawia się na inny tryb.",en:"Something important is gone for good — a person, a chance, a status, an illusion. The situation can no longer be fixed by action, so the organism switches to a different mode."},impulse:{pl:"Ciało robi się ciężkie, klatka piersiowa zapada się do wewnątrz, energia opada. To fizjologiczne wyciszenie — organizm oszczędza siły zamiast walczyć o coś, czego już nie ma.",en:"The body feels heavy, the chest caves inward, energy drops. It's a physiological shutdown — the organism conserves strength instead of fighting for something that's already gone."},action:{pl:"Opadająca energia wychodzi na zewnątrz jako łzy, spowolniony głos, znieruchomienie. To zarazem rozładowanie napięcia i czytelny sygnał dla innych: „potrzebuję pomocy”.",en:"The dropping energy surfaces as tears, a slowed voice, stillness. It's both a release of tension and a clear signal to others: “I need help.”"},function:{pl:"Smutek istnieje po to, by przyciągnąć wsparcie grupy i dać czas na przetworzenie straty, zanim organizm na nowo zaangażuje się w życie.",en:"Sadness exists to draw the group's support and to allow time to process the loss before the organism re-engages with life."}},intensity:{low:{pl:"Zaduma",en:"Pensiveness"},medium:{pl:"Smutek",en:"Sadness"},high:{pl:"Rozpacz",en:"Grief"}},vector:{pl:"W DÓŁ / DO ŚRODKA",en:"DOWNWARD / INWARD"},signals:{pl:["Opadające kąciki ust i powiek","Wzrok wbity w ziemię lub 'nieobecny'","Zgarbiona sylwetka, zapadnięta klatka piersiowa","Powolne, ociężałe ruchy (letarg)","Cichy, monotonny lub łamiący się głos","Łzy, szklące się oczy","Zasłanianie twarzy dłońmi","Apatia, brak reakcji na bodźce zewnętrzne"],en:["Drooping corners of mouth and eyelids","Gaze fixed on the ground or 'absent'","Slumped silhouette, sunken chest","Slow, heavy movements (lethargy)","Quiet, monotone or breaking voice","Tears, glassy eyes","Covering face with hands","Apathy, lack of reaction to external stimuli"]},colorClass:"text-blue-500",nameClass:"text-blue-700 dark:text-blue-500",bgLightClass:"bg-blue-500/10",hex:"#3b82f6",icon:Gy},{id:"DISGUST",name:{pl:"Wstręt",en:"Disgust"},desc:{pl:"Ochrona organizmu przed zatruciem fizycznym (jedzenie) lub moralnym (zachowanie).",en:"Protection of the organism against physical poisoning (food) or moral poisoning (behavior)."},stimulus:{pl:"TOKSYNA",en:"TOXIN"},impulse:{pl:"Mdłości / Skurcz",en:"Nausea / Contraction"},action:{pl:"WYPYCHANIE / PLUCIE",en:"PUSHING AWAY / SPITTING"},function:{pl:"ODRZUCENIE",en:"REJECTION"},mechanism:{stimulus:{pl:"Organizm wykrywa coś potencjalnie szkodliwego — zepsute jedzenie, ale też zachowanie łamiące normy moralne. Mózg traktuje „moralny brud” tym samym mechanizmem, co fizyczną truciznę.",en:"The organism detects something potentially harmful — spoiled food, but also behavior that breaks moral norms. The brain treats “moral filth” with the very same mechanism as physical poison."},impulse:{pl:"Żołądek się kurczy, pojawia się odruch mdłości, twarz automatycznie się marszczy, by zmniejszyć pole oddychania i widzenia — ciało próbuje odciąć się od kontaktu z bodźcem.",en:"The stomach contracts, a nauseous reflex appears, the face automatically wrinkles to reduce breathing and viewing exposure — the body tries to cut off contact with the stimulus."},action:{pl:"Skurcz zamienia się w gest odrzucenia: odwrócenie głowy, zasłonięcie ust lub nosa, cofnięcie tułowia, a w skrajnym przypadku — dosłowne wypluwanie czy wymioty.",en:"The contraction turns into a gesture of rejection: turning the head away, covering the mouth or nose, pulling the torso back, or in extreme cases, literal spitting or vomiting."},function:{pl:"Wstręt istnieje po to, by chronić organizm i grupę przed skażeniem — fizycznym (choroby, trucizny) i społecznym (zachowania niszczące wspólnotę).",en:"Disgust exists to protect the organism and the group from contamination — physical (disease, poison) and social (behavior that undermines the community)."}},intensity:{low:{pl:"Nuda",en:"Boredom"},medium:{pl:"Wstręt",en:"Disgust"},high:{pl:"Odraza",en:"Loathing"}},vector:{pl:"OD SIEBIE / BLOKADA",en:"AWAY FROM SELF / BLOCKING"},signals:{pl:["Marszczenie nosa","Uniesienie górnej wargi (grymas)","Mrużenie oczu (ograniczenie pola widzenia)","Odwracanie głowy od źródła bodźca","Zasłanianie ust lub nosa dłonią","Odruch wymiotny, przełykanie śliny","Cofanie tułowia (odchylenie w tył)","Zaciskanie ust (blokada przed wniknięciem)"],en:["Wrinkling nose","Raising upper lip (sneer)","Squinting eyes (limiting field of vision)","Turning head away from stimulus source","Covering mouth or nose with hand","Gag reflex, swallowing saliva","Retracting torso (leaning back)","Pressing lips together (blocking entry)"]},colorClass:"text-purple-500",nameClass:"text-purple-700 dark:text-purple-500",bgLightClass:"bg-purple-500/10",hex:"#a855f7",icon:$y},{id:"ANGER",name:{pl:"Gniew",en:"Anger"},desc:{pl:"Organizm rozpoznaje przeszkodę, którą może pokonać. Mobilizacja energii do walki.",en:"The organism recognizes an obstacle it can overcome. Mobilization of energy to fight."},stimulus:{pl:"PRZESZKODA",en:"OBSTACLE"},impulse:{pl:"Gorąco / Adrenalina",en:"Heat / Adrenaline"},action:{pl:"ATAK / PRZEBICIE",en:"ATTACK / BREAKTHROUGH"},function:{pl:"DESTRUKCJA",en:"DESTRUCTION"},mechanism:{stimulus:{pl:"Coś blokuje realizację celu, ale organizm ocenia, że ma dość siły, by to pokonać. To kluczowa różnica względem strachu: tu przeszkoda wydaje się możliwa do przebicia.",en:"Something is blocking a goal, but the organism assesses it has enough strength to overcome it. This is the key difference from fear: here the obstacle seems possible to break through."},impulse:{pl:"Krew napływa do rąk i twarzy, temperatura ciała rośnie, mięśnie się napinają. Adrenalina mobilizuje całe ciało do jednego zadania: przebicia się przez przeszkodę.",en:"Blood rushes to the hands and face, body temperature rises, muscles tense. Adrenaline mobilizes the whole body for one task: breaking through the obstacle."},action:{pl:"Napięcie wyładowuje się do przodu: zaciśnięte pięści, wysunięta żuchwa, podniesiony głos, fizyczny nacisk na przeszkodę lub osobę, która ją reprezentuje.",en:"The tension discharges forward: clenched fists, a jutting jaw, a raised voice, physical pressure on the obstacle or the person who represents it."},function:{pl:"Gniew istnieje po to, by usuwać przeszkody stojące na drodze do zasobów lub bezpieczeństwa — to energia mobilizacji, nie zawsze przemocy.",en:"Anger exists to remove obstacles standing in the way of resources or safety — it's mobilizing energy, not always violence."}},intensity:{low:{pl:"Irytacja",en:"Annoyance"},medium:{pl:"Gniew",en:"Anger"},high:{pl:"Wściekłość",en:"Rage"}},vector:{pl:"DO PRZODU / TARCIE",en:"FORWARD / FRICTION"},signals:{pl:["Zaciśnięte szczęki, zgrzytanie zębami","Czerwienienie się twarzy i szyi","Rozdęte nozdrza","Zaciśnięte pięści (bielenie knykci)","Wysunięcie żuchwy lub głowy do przodu","Napięcie mięśni ramion i karku","Głośniejszy, szorstki ton głosu","Intensywny kontakt wzrokowy (tunelowe widzenie)"],en:["Clenched jaws, grinding teeth","Reddening of face and neck","Flaring nostrils","Clenched fists (whitening knuckles)","Jutting jaw or head forward","Tension in shoulder and neck muscles","Louder, harsh voice tone","Intense eye contact (tunnel vision)"]},colorClass:"text-red-500",nameClass:"text-red-700 dark:text-red-500",bgLightClass:"bg-red-500/10",hex:"#ef4444",icon:i0},{id:"ANTICIPATION",name:{pl:"Oczekiwanie",en:"Anticipation"},desc:{pl:"Aktywne poszukiwanie informacji. Przygotowanie ciała na to, co dopiero nadejdzie.",en:"Active search for information. Preparing the body for what is yet to come."},stimulus:{pl:"NIEZNANE TERYTORIUM",en:"UNKNOWN TERRITORY"},impulse:{pl:"Wyostrzenie zmysłów",en:"Sharpening of senses"},action:{pl:"SKANOWANIE / TROPIENIE",en:"SCANNING / TRACKING"},function:{pl:"EKSPLORACJA",en:"EXPLORATION"},mechanism:{stimulus:{pl:"Organizm wchodzi w sytuację z niepewnym wynikiem — coś ważnego może się wydarzyć, ale jeszcze nie wiadomo co. Brak informacji sam w sobie staje się bodźcem.",en:"The organism enters a situation with an uncertain outcome — something important may happen, but it's not yet clear what. The lack of information itself becomes the stimulus."},impulse:{pl:"Źrenice się rozszerzają, mięśnie lekko napinają w gotowości do ruchu, uwaga zawęża się do jednego punktu. Ciało przygotowuje się, by błyskawicznie zareagować na to, co nadejdzie.",en:"Pupils dilate, muscles tense slightly in readiness to move, attention narrows to a single point. The body prepares to react instantly to whatever comes next."},action:{pl:"Napięcie zamienia się w aktywne poszukiwanie: wpatrywanie się w jeden punkt, wiercenie się, pochylanie ciała do przodu, skanowanie wzrokiem otoczenia w poszukiwaniu wskazówek.",en:"The tension turns into active searching: staring at one point, fidgeting, leaning the body forward, scanning the environment for clues."},function:{pl:"Oczekiwanie istnieje po to, by napędzać aktywne zdobywanie informacji o otoczeniu — dzięki niemu organizm nie czeka biernie, tylko przygotowuje się i eksploruje z wyprzedzeniem.",en:"Anticipation exists to drive the active gathering of information about the environment — thanks to it, the organism doesn't wait passively but prepares and explores in advance."}},intensity:{low:{pl:"Ciekawość",en:"Interest"},medium:{pl:"Oczekiwanie",en:"Anticipation"},high:{pl:"Czujność",en:"Vigilance"}},vector:{pl:"DO PRZODU (Głowa)",en:"FORWARD (Head)"},signals:{pl:["Rozszerzone źrenice (chęć chłonięcia informacji)","Lekkie napięcie mięśni (gotowość do startu)","Oblizywanie ust (z niepokoju lub ekscytacji)","Wiercenie się, tupanie, bębnienie palcami","Wpatrywanie się w jeden punkt (np. drzwi, telefon)","Pochylenie głowy lub tułowia do przodu","Wstrzymywanie oddechu w kluczowych momentach","Skanowanie otoczenia wzrokiem"],en:["Dilated pupils (desire to absorb information)","Slight muscle tension (readiness to start)","Licking lips (from anxiety or excitement)","Fidgeting, tapping, drumming fingers","Staring at one point (e.g., door, phone)","Leaning head or torso forward","Holding breath at key moments","Scanning the environment with eyes"]},colorClass:"text-orange-500",nameClass:"text-orange-700 dark:text-orange-500",bgLightClass:"bg-orange-500/10",hex:"#f97316",icon:t0}],Qa={pl:{title:"Koło Emocji",subtitle:"Aparat Aktorski & Teoria Ewolucyjna",nav:{shuffle:"LOSUJ",dyads:"DIADY",catalog:"KATALOG",theory:"TEORIA"},stageToggle:{light:"Włącz tryb jasny",dark:"Włącz tryb ciemny"},langToggle:{lang:"en",label:"Switch to English"},shuffleBtn:"LOSUJ EMOCJĘ",dyadsTitle:"Mieszanina Emocji",dyadsDesc:"Emocje łączą się w diady tworząc złożone stany emocjonalne.",dyadsResult:"WYNIK (DIADA)",dyadsBtn:"LOSUJ PARĘ",catalogTitle:"Katalog Podstawowy",modal:{mechanism:"Mechanizm Powstawania (Teoria Plutchika & Jamesa-Langego)",neuroception:"*Neurocepcja: Ciało reaguje na bodziec (impuls) szybciej niż umysł nada mu nazwę (emocja).",motorics:"Motoryka",movementVector:"Wektor ruchu",bodyDictionary:"Słownik Ciała (Sygnały Somatyczne)",bodyDictDesc:"Zewnętrzne i wewnętrzne objawy fizjologiczne. Skorzystaj z nich, by zbudować wiarygodną reakcję postaci.",actorPerspective:"Perspektywa Aktora",bodySignal:"Sygnał z ciała (Co czuję?)",scenicGoal:"Cel sceniczny (Zadanie)",back:"Zamknij",stimulus:"Bodziec",impulse:"Impuls",emotion:"Emocja",action:"Działanie",bioGoal:"Cel Biologiczny",energyScale:"Skala Energii (Intensywność)",affect:"Afekt",signal:"Sygnał",mechanismHint:"Dotknij etapu, żeby zobaczyć, co dzieje się w tej emocji.",next:"Dalej"},footer:{about:"Interaktywne narzędzie dydaktyczne opracowane dla studentów Wydziału Aktorskiego Akademii Teatralnej w Warszawie.",usage:"Do użytku edukacyjnego"}},en:{title:"Emotion Wheel",subtitle:"Actor's Tool & Evolutionary Theory",nav:{shuffle:"SHUFFLE",dyads:"DYADS",catalog:"CATALOG",theory:"THEORY"},stageToggle:{light:"Switch to light mode",dark:"Switch to dark mode"},langToggle:{lang:"pl",label:"Przełącz na polski"},shuffleBtn:"RANDOM EMOTION",dyadsTitle:"Emotion Mixture",dyadsDesc:"Emotions combine into dyads creating complex emotional states.",dyadsResult:"RESULT (DYAD)",dyadsBtn:"RANDOM PAIR",catalogTitle:"Primary Catalog",modal:{mechanism:"Mechanism of Origin (Plutchik & James-Lange Theory)",neuroception:"*Neuroception: The body reacts to a stimulus faster than the mind names it.",motorics:"Motorics",movementVector:"Movement Vector",bodyDictionary:"Body Dictionary (Somatic Signals)",bodyDictDesc:"External and internal physiological symptoms. Use them to build a credible character reaction.",actorPerspective:"Actor's Perspective",bodySignal:"Body Signal (What do I feel?)",scenicGoal:"Scenic Goal (Task)",back:"Close",stimulus:"Stimulus",impulse:"Impulse",emotion:"Emotion",action:"Action",bioGoal:"Biological Goal",energyScale:"Energy Scale (Intensity)",affect:"Affect",signal:"Signal",mechanismHint:"Tap a stage to see what happens in this emotion.",next:"Next"},footer:{about:"Interactive educational tool developed for the students of the Acting Department at the Theatre Academy in Warsaw.",usage:"For educational use"}}},T0={pl:"8 emocji Roberta Plutchika",en:"Robert Plutchik's 8 Emotions"},Ss={shuffle:"losuj",dyads:"diady",catalog:"katalog",manifesto:"teoria"},Fd=f=>f.name.pl.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(),ps=(f,w)=>`#${Ss[f]}${w?`/${Fd(w)}`:""}`,Bd=f=>{const[w,A]=dec ssName:"w-full",children:[o.jsxs("div",{className:"flex justify-between items-start mb-4",children:[o.jsx("div",{className:`p-3 rounded-2xl transition-colors ${r.colorClass} ${r.bgLightClass}`,children:o.jsx(r.icon,{size:28,strokeWidth:2})}),o.jsx("span",{className:"text-xs font-bold uppercase tracking-widest border px-2 py-1 rounded border-slate-200 text-slate-500 dark:border-slate-700 dark:text-slate-400",children:r.function[f]})]}),o.jsx("h3",{className:`font-black uppercase text-xl sm:text-2xl tracking-tight mb-2 ${r.nameClass}`,children:o.jsx("button",{type:"button",onClick:E=>w(r,E.currentTarget),className:"uppercase text-left cursor-pointer focus:outline-none after:absolute after:inset-0 after:rounded-3xl",children:r.name[f]})}),o.jsx("p",{className:"text-xs sm:text-sm leading-relaxed opacity-70 mb-4 line-clamp-3",children:r.desc[f]})]}),o.jsxs("div",{className:"w-full pt-4 border-t flex items-center gap-2 text-xs font-bold uppercase tracking-wide opacity-80 border-slate-100 dark:border-slate-800",children:[o.jsx(y0,{size:14}),o.jsxs("span",{children:[A.modal.movementVector,": ",r.vector[f].split("/")[0]]})]})]},r.id))})]})},ce={title:{pl:"Teoria — ale inaczej",en:"Theory — Differently"},subtitle:{pl:"Nie po to, żeby zdać egzamin. Po to, żeby zrozumieć, co robi twoje ciało, zanim zdążysz pomyśleć.",en:"Not to pass a test. To understand what your body does before you even think."},hook:{eyebrow:{pl:"Teza",en:"The claim"},title:{pl:"Nie musisz poczuć, żeby zagrać",en:"You Don't Have to Feel It to Play It"},body:{pl:"Przez większość XX wieku aktorów uczono, że emocja jest punktem wyjścia — najpierw poczuj, potem pokaż. Fizjolog William James i duński lekarz Carl Lange zaproponowali odwrotną kolejność: to nie strach każe ci uciekać — to ucieczka (przyspieszony puls, spięte mięśnie, płytki oddech) każe mózgowi nazwać to, co się dzieje, „strachem”. Emocja przychodzi *po* ciele, nie przed nim. Dla aktora to nie ciekawostka z podręcznika — to metoda: zbuduj Impuls (oddech, napięcie, tempo), a Emocja pojawi się sama, bez wymuszania.",en:"For most of the 20th century, actors were taught that emotion comes first — feel it, then show it. Physiologist William James and Danish physician Carl Lange proposed the reverse: it isn't fear that makes you run — it's the running (racing pulse, tensed muscles, shallow breath) that makes the brain label what's happening as “fear.” Emotion arrives *after* the body, not before it. For an actor this isn't a textbook curiosity — it's a method: build the Impulse (breath, tension, tempo) and the Emotion will follow on its own, without forcing it."},oldOrder:{pl:"Najpierw poczuj",en:"Feel first"},newOrder:{pl:"James–Lange",en:"James–Lange"},bodyWord:{pl:"Ciało",en:"Body"},emotionWord:{pl:"Emocja",en:"Emotion"}},context:{eyebrow:{pl:"Kontekst",en:"Context"},title:{pl:"Człowiek, który zrobił mapę uczuć",en:"The Man Who Mapped Feelings"},body:{pl:"Robert Plutchik, amerykański psycholog, spędził dwie dekady (lata 60.–80. XX wieku) na pytaniu, które brzmi banalnie, dopóki nie spróbujesz na nie odpowiedzieć: ile jest właściwie emocji? Zamiast liczyć słowa w słowniku (angielski ma ich setki), spojrzał na zachowanie — swoje i innych gatunków. Doszedł do ośmiu wzorców reakcji, które da się znaleźć nie tylko u ludzi, ale i u zwierząt: coś, co pozwala uciec przed drapieżnikiem, coś, co przyciąga do partnera, coś, co odpycha od zepsutego jedzenia. Nazwał je emocjami podstawowymi i ułożył w koło — nie dlatego, że lubił ładne diagramy, tylko dlatego, że emocje sąsiadujące na kole mieszają się ze sobą równie łatwo, jak sąsiadujące kolory na palecie.",en:"Robert Plutchik, an American psychologist, spent two decades (1960s–80s) chasing a question that sounds trivial until you try to answer it: how many emotions actually exist? Instead of counting words in a dictionary (English has hundreds), he looked at behavior — human and animal. He arrived at eight response patterns found across species: something that lets you flee a predator, something that pulls you toward a mate, something that pushes you away from spoiled food. He called them basic emotions and arranged them in a wheel — not because he liked neat diagrams, but because emotions that sit next to each other on the wheel blend as easily as neighboring colors on a palette."},link:{pl:"Zobacz to w praktyce: Diady",en:"See it in practice: Dyads"}},debate:{eyebrow:{pl:"Spór",en:"The debate"},title:{pl:"Od środka czy od ciała? Spór, który wciąż trwa",en:"From the Inside or From the Body? A Debate Still Alive"},body:{pl:"Ta aplikacja łączy dwie teorie, które nie zawsze się ze sobą zgadzają — i warto to przyznać wprost, zamiast udawać, że nauka mówi jednym głosem. Plutchik opisuje emocję jako *ocenę sytuacji*: mózg rozpoznaje bodziec jako korzystny lub groźny, zanim jeszcze cokolwiek poczujesz. James i Lange twierdzą coś mocniejszego: że sama ocena to za mało — emocja *jest* odczytaniem reakcji ciała. To dokładnie ten sam spór, który od stu lat dzieli sale prób. Stanisławski uczył pracy „od środka” — pamięć emocjonalna, wyobraźnia, dopiero potem ciało. Meisner, Grotowski i technika fizyczna uczą odwrotnie — od konkretnego działania i impulsu ciała, emocja ma się pojawić jako efekt uboczny, nie cel. Ta aplikacja stoi bliżej tej drugiej szkoły: każda karta emocji pokazuje najpierw Impuls (co robi ciało), dopiero potem nazwę uczucia.",en:"This app combines two theories that don't always agree with each other — and that's worth admitting outright, rather than pretending science speaks with one voice. Plutchik describes emotion as an *assessment of the situation*: the brain recognizes a stimulus as beneficial or threatening before you feel anything. James and Lange make a stronger claim: that assessment alone isn't enough — emotion *is* the reading of the body's reaction. This is exactly the debate that has split rehearsal rooms for a century. Stanislavski taught working “from the inside” — emotional memory and imagination first, the body second. Meisner, Grotowski, and physical-action technique teach the reverse — from concrete action and bodily impulse, with emotion appearing as a by-product, not a goal. This app leans toward the second school: every emotion card shows the Impulse (what the body does) before naming the feeling."},schools:[{label:{pl:"Od środka",en:"From the inside"},who:{pl:"Stanisławski",en:"Stanislavski"},steps:{pl:"pamięć emocjonalna, wyobraźnia → ciało",en:"emotional memory, imagination → body"},app:!1},{label:{pl:"Od ciała",en:"From the body"},who:{pl:"Meisner, Grotowski, technika fizyczna",en:"Meisner, Grotowski, physical action"},steps:{pl:"działanie, impuls ciała → emocja",en:"action, bodily impulse → emotion"},app:!0}],appLeans:{pl:"Bliżej tej szkoły stoi aplikacja",en:"This app leans this way"}},rules:{eyebrow:{pl:"Reguły gry",en:"Rules of the game"},title:{pl:"5 reguł, które warto znać, zanim zaczniesz losować karty",en:"5 Rules Worth Knowing Before You Start Drawing Cards"},hint:{pl:"Dotknij reguły, żeby zobaczyć, co znaczy na scenie.",en:"Tap a rule to see what it means on stage."},onStage:{pl:"Na scenie",en:"On stage"},items:[{thesis:{pl:"Emocje są wspólne dla wszystkich gatunków.",en:"Emotions are shared across species."},plutchik:{pl:"Te same wzorce reakcji znajdziesz u człowieka i u zwierzęcia broniącego terytorium.",en:"The same response patterns show up in humans and in an animal defending its territory."},stage:{pl:"Strach czy gniew, które grasz, nie są „kulturowe” — możesz czerpać z najbardziej fizycznej, zwierzęcej wersji impulsu, bez wstydu, że to „za mało subtelne”.",en:"The fear or anger you're playing isn't “cultural” — you can draw on the rawest, most animal version of the impulse without worrying it's “too unsubtle.”"}},{thesis:{pl:"Jest ich niewiele, reszta to mieszanki.",en:"There are few of them, everything else is a mix."},plutchik:{pl:"8 podstawowych, wszystko inne — jak zazdrość czy nostalgia — to ich kombinacje.",en:"8 basic ones; everything else — jealousy, nostalgia — is a combination."},stage:{pl:"Skomplikowana postać to nie osobna, tajemnicza emocja do odkrycia — to zwykle dwie znane ci już emocje, zmieszane w niewłaściwych proporcjach.",en:"A complicated character isn't some separate, mysterious emotion to discover — it's usually two emotions you already know, mixed in the wrong proportions."},link:{view:"dyads",label:{pl:"Zobacz Diady",en:"See the Dyads"}}},{thesis:{pl:"Mają różne natężenie.",en:"They vary in intensity."},plutchik:{pl:"Każda emocja rozciąga się od słabej do ekstremalnej wersji (np. spokój → radość → euforia).",en:"Every emotion spans from mild to extreme (e.g. serenity → joy → ecstasy)."},stage:{pl:"„Zagraj radość” to złe zadanie reżyserskie. „Zagraj radość na 3 z 10, potem na 9 z 10” — to konkretne, mierzalne zadanie aktorskie. Drabinę intensywności znajdziesz na karcie każdej emocji.",en:"“Play joy” is a bad direction. “Play joy at 3 out of 10, then at 9 out of 10” is a concrete, playable task. You'll find the intensity ladder on each emotion's card."},link:{view:"catalog",label:{pl:"Otwórz Katalog",en:"Open the Catalog"}}},{thesis:{pl:"Emocje mają swoje przeciwieństwa i nie mieszają się z nimi.",en:"Emotions have opposites and don't blend with them."},plutchik:{pl:"Radość i smutek, zaufanie i wstręt — leżą naprzeciw siebie na kole i wykluczają się w danym momencie.",en:"Joy and sadness, trust and disgust sit opposite each other on the wheel and cancel each other out in the moment."},stage:{pl:"Jeśli scena wymaga gwałtownej zmiany z radości w smutek, to nie jest płynne przejście — to twarde cięcie. Zagraj je jako cięcie, nie jako gradient.",en:"If a scene demands a sudden swing from joy to sadness, that's not a smooth transition — it's a hard cut. Play it as a cut, not a gradient."}},{thesis:{pl:"Wszystkie służą przetrwaniu, nawet te „negatywne”.",en:"All of them serve survival, even the “negative” ones."},plutchik:{pl:"Każda emocja — łącznie ze strachem, wstrętem czy gniewem — ma funkcję biologiczną, żadna nie jest błędem systemu.",en:"Every emotion — including fear, disgust, or anger — has a biological function; none of them is a system error."},stage:{pl:"Najczęstszy błąd młodego aktora to granie gniewu czy strachu jako „utraty kontroli”. To odwrotność prawdy — to najbardziej funkcjonalne, celowe stany, jakie ma ciało. Zagraj cel, nie chaos.",en:"The most common beginner mistake is playing anger or fear as “losing control.” It's the opposite of the truth — these are the most functional, purposeful states the body has. Play the purpose, not the chaos."}}]},cta:{eyebrow:{pl:"Praktyka",en:"Practice"},title:{pl:"Teraz zobacz, jak to działa w ciele",en:"Now See How It Works in the Body"},body:{pl:"Teoria kończy się tutaj — reszta dzieje się w ćwiczeniu. Wylosuj kartę, przeczytaj Impuls, zanim przeczytasz nazwę emocji, i spróbuj zbudować go w ciele, zanim zdecydujesz, co „grasz”.",en:"The theory ends here — the rest happens in practice. Draw a card, read the Impulse before you read the emotion's name, and try building it in your body before deciding what you're “playing.”"},draw:{pl:"Losuj kartę",en:"Draw a Card"},dyads:{pl:"Zobacz Diady",en:"See the Dyads"}}},Gd=f=>f.split(/(\*[^*]+\*)/).map((w,A)=>w.length>2&&w.startsWith("*")&&w.endsWith("*")?o.jsx("em",{children:w.slice(1,-1)},A):w),gs="bg-white border-slate-200 not-dark:shadow-sm dark:bg-slate-900 dark:border-slate-800",Zd="text-teal-800 hover:bg-slate-100 dark:text-teal-300 dark:hover:bg-slate-800",bs="text-teal-800 dark:text-teal-300",Ld="border-teal-700 bg-teal-50 dark:border-teal-500 dark:bg-teal-500/10",C0=({lang:f,onGoTo:w,onDraw:A})=>{const r=(E,N)=>o.jsxs("p",{className:"text-xs font-mono font-bold uppercase tracking-widest opacity-70 mb-2",children:[E,"/5 · ",N[f]]});return o.jsxs("article",{className:"w-full max-w-2xl animate-fade space-y-5 sm:space-y-6 pb-12 sm:pb-20 px-1 sm:px-0",children:[o.jsxs("header",{className:"text-center px-2 mb-2 sm:mb-4",children:[o.jsx("h2",{classNa
